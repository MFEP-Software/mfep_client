[package]
name = "mfep_client"
version = "0.1.0"
edition = "2021"

[lib]
name = "mfep_client"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mfep_client_cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
pyo3 = { version = "0.30.1", features = ["extension-module"] }